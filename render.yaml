services:
  - type: web
    name: woundwatch
    runtime: docker
    plan: 1c-2g
    region: singapore
    dockerfilePath: ./service/Dockerfile
    dockerContext: .
    healthCheckPath: /live
    envVars:
      - key: WOUNDWATCH_ENV
        value: production
      - key: WOUNDWATCH_DATA_DIR
        value: /var/data
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
      - key: MAX_IMAGE_PIXELS
        value: "4000000"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "2"
    disk:
      name: woundwatch-data
      mountPath: /var/data
      sizeGB: 1
